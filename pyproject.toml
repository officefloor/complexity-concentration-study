[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "complexity-concentration-study"
version = "0.0.1"
description = "Identify god classes/methods as relative outliers in per-unit code complexity."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Daniel Sagenschneider" }]
keywords = [
    "code-quality", "complexity", "god-class", "code-smell", "static-analysis",
    "technical-debt", "refactoring", "outlier-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
# Language-independent: lizard supplies the multi-language function list, cyclomatic
# complexity and line ranges; everything above it is lexical. (Same substrate as impact-gate.)
# PINNED, not >=: lizard 1.24.x parses a Java class annotated @Entity then @Table(...) to
# ZERO functions (study.check_parser fails closed on it). PMD 7.27.0 and CK 0.7.0 are
# pinned in study.py.
# The sample, and the loop that clones each sampled repository at its pinned commit, come from
# open-source-repository-sampler, pinned to its PyPI release.
dependencies = [
    "lizard==1.23.0",
    "open-source-repository-sampler==0.1.0",
]

[project.scripts]
complexity-concentration-study = "complexity_concentration_study.cli:main"
ccs = "complexity_concentration_study.cli:main"

[tool.setuptools]
packages = ["complexity_concentration_study"]
